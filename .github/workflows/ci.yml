name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Concurrency groups are separated by event type so no event can cancel or
# replace another event's queued run. Per current GitHub docs, with the
# default pending policy ("single") a newly queued run CANCELS and replaces
# any pending run sharing a group, so:
# - pull_request runs group per PR NUMBER (not head branch name): same-named
#   branches in different forks keep distinct groups, and a branch named after
#   a main SHA cannot cancel that push's run.
# - push runs group per unique commit SHA: distinct merged commits on main
#   never share a pending slot, so no queued run for another merged commit is
#   dropped (future release form).
# - workflow_dispatch runs of a SHA keep their own group: a dispatch can never
#   replace the pending push run of the same SHA; repeated dispatches of one
#   SHA serialize instead.
# cancel-in-progress stays limited to pull_request events, so superseded PR
# heads cancel only their own previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    # Stable required-check name (do not rename without updating branch settings).
    name: Verify (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.19.0, 24.x]
    # Pure/unit tier plus packaging: no browser needed, so provisioning stays skipped.
    env:
      PI_REVIEW_GATE_SKIP_PLAYWRIGHT_CHROMIUM: "1"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Full history is required for the PR changelog candidate check below,
          # which counts the pull request base's first-parent distance from the
          # immutable baseline. The default shallow checkout cannot count it.
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Static checks
        run: npm run check:static
      - name: PR changelog candidate check (next-build numbering)
        # Event/history-aware and read-only: on pull_request events it validates
        # that the candidate build section in CHANGELOG.md is numbered from this
        # pull request's current base (first-parent distance + 1). It no-ops for
        # push/dispatch events; the publisher re-validates the exact merged
        # commit before any remote write.
        run: node scripts/release/pr-candidate.cjs
      - name: Fast tests
        run: npm run test:fast
      - name: CI workflow contract tests
        run: node --test dist-test/tests/ci-workflow.test.js
      - name: Package smoke
        run: npm run test:package

  full-tests:
    # Stable required-check name (do not rename without updating branch settings).
    name: Full suite (Node 24)
    # Runs for pull requests, pushes to the default branch, AND manual dispatch;
    # only pushes to non-default branches are excluded (no hidden skip on the
    # enforced trigger paths).
    if: github.event_name != 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    # Deliberately bounded: a runaway Linux full-suite run must fail instead of
    # occupying the runner for close to an hour. The suite step below carries a
    # tighter cap of its own; raise these only alongside the focused workflow
    # contract test that asserts both limits.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.x
          cache: npm
      # Skip the best-effort postinstall provisioning during npm ci so the
      # browser is installed exactly once, with Linux OS dependencies, below.
      - name: Install dependencies
        run: npm ci
        env:
          PI_REVIEW_GATE_SKIP_PLAYWRIGHT_CHROMIUM: "1"
      - name: Install Chromium with Linux OS dependencies
        # Narrow: only the Chromium browser plus its system libraries.
        run: npx playwright install --with-deps chromium
      - name: Install pinned Pi agent-core runtime
        # tests/browser-native-error.test.ts drives the real agentLoop from an
        # installed Pi agent-core build. 1.0.2 is verified against the current
        # extension sources (and needs Node >=22.19.0, which the verify matrix
        # exercises at its minimum).
        # The test skips itself when PI_BROWSER_AGENT_RUNTIME is unset; this job
        # always sets it, so the regression genuinely runs in CI.
        # Install the locked tree to avoid transitive range drift and registry
        # metadata inconsistencies during upstream releases. When changing the
        # pin, regenerate the lock in scripts/ci/pi-agent-runtime with
        # `npm install --package-lock-only`.
        run: |
          rm -rf "$RUNNER_TEMP/pi-agent-runtime"
          mkdir -p "$RUNNER_TEMP/pi-agent-runtime"
          cp scripts/ci/pi-agent-runtime/package.json scripts/ci/pi-agent-runtime/package-lock.json "$RUNNER_TEMP/pi-agent-runtime/"
          cd "$RUNNER_TEMP/pi-agent-runtime"
          npm ci --no-audit --no-fund
      - name: Export Pi runtime path
        run: echo "PI_BROWSER_AGENT_RUNTIME=$RUNNER_TEMP/pi-agent-runtime/node_modules/@earendil-works/pi-agent-core/dist/index.js" >> "$GITHUB_ENV"
      - name: Install fd file-finder (Pi native @ picker requirement)
        # pi-tui's CombinedAutocompleteProvider backs the `@` file picker with
        # fd/fdfind; the picker cannot list files without it. Ubuntu's fd-find
        # package installs the binary as fdfind, which the real-host helper
        # finds alongside fd. The @ smoke must exercise the real finder, so
        # the step fails the job when neither binary is available afterwards —
        # never a silent skip.
        run: |
          if ! command -v fd >/dev/null 2>&1 && ! command -v fdfind >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y --no-install-recommends fd-find
          fi
          command -v fd >/dev/null 2>&1 || command -v fdfind >/dev/null 2>&1
          echo "PI_REVIEW_GATE_FD=$(command -v fd || command -v fdfind)" >> "$GITHUB_ENV"
      - name: Install pinned full Pi UI runtime
        # tests/pi-tui-live-settings-smoke.test.ts (and the bridge integration
        # tier in tests/native-editor-bridge.test.ts) drive the real Pi TUI
        # surface — CustomEditor, pi-tui components, and the pi CLI entry from
        # @earendil-works/pi-coding-agent. 1.0.2 is verified against the
        # current extension sources (and needs Node >=22.19.0, which the verify
        # matrix exercises at its minimum). Install the locked tree into the
        # runner temp exactly like the agent-core runtime above: a test-only
        # install, never a shipping package dependency. When changing the pin,
        # regenerate the lock in scripts/ci/pi-ui-runtime with
        # `npm install --package-lock-only`.
        run: |
          rm -rf "$RUNNER_TEMP/pi-ui-runtime"
          mkdir -p "$RUNNER_TEMP/pi-ui-runtime"
          cp scripts/ci/pi-ui-runtime/package.json scripts/ci/pi-ui-runtime/package-lock.json "$RUNNER_TEMP/pi-ui-runtime/"
          cd "$RUNNER_TEMP/pi-ui-runtime"
          npm ci --no-audit --no-fund
      - name: Export Pi UI runtime path and require real Pi hosts
        # Pin the host helpers and installed-command RPC smoke to this exact
        # fresh runtime; the version assertion is enforced by the smoke test.
        run: |
          echo "PI_REVIEW_GATE_INSTALLED_AGENT=$RUNNER_TEMP/pi-ui-runtime/node_modules/@earendil-works/pi-coding-agent" >> "$GITHUB_ENV"
          echo "PI_REVIEW_GATE_INSTALLED_PI_BIN=$RUNNER_TEMP/pi-ui-runtime/node_modules/.bin" >> "$GITHUB_ENV"
          echo "PI_REVIEW_GATE_REQUIRE_PI_HOST=1" >> "$GITHUB_ENV"
          echo "PI_REVIEW_GATE_EXPECT_PI_VERSION=1.0.2" >> "$GITHUB_ENV"
      - name: Build review-gate candidate extension into scratch (never live dist)
        # The TUI smoke launches the built extension through pi's public
        # --no-extensions --extension seam. The candidate is compiled into the
        # runner temp so the disposable CI checkout's dist/ (and a developer
        # checkout's live dist/) is never touched by CI. The compiled entry
        # resolves its own runtime dependencies (playwright, linkedom, undici,
        # ...) with plain Node resolution, so the checkout's installed tree is
        # linked into the candidate directory — without it, pi outside the
        # checkout cannot load the extension and the required smoke fails.
        run: |
          mkdir -p "$RUNNER_TEMP/review-gate-candidate"
          npx tsc -p tsconfig.json --outDir "$RUNNER_TEMP/review-gate-candidate/dist"
          ln -sfn "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/review-gate-candidate/node_modules"
          # The extension loads its packaged mode prompts from ../../scripts
          # relative to the compiled entry; expose the packaged scripts to
          # this disposable candidate root without touching checkout dist/.
          ln -sfn "$GITHUB_WORKSPACE/scripts" "$RUNNER_TEMP/review-gate-candidate/scripts"
      - name: Export candidate extension entry
        run: echo "PI_REVIEW_GATE_CANDIDATE_ENTRY=$RUNNER_TEMP/review-gate-candidate/dist/src/index.js" >> "$GITHUB_ENV"
      # PI_REVIEW_GATE_RUNTIME_ROLE must stay unset so activation tests observe
      # the default (no executor role) behavior; test files manage it themselves.
      - name: Build test bundle
        run: npm run build:test
      - name: Full test suite
        # Step-level cap inside the 15-minute job cap above: a hung suite step
        # fails here at 10 minutes instead of consuming the whole job budget.
        # The suite coverage is exactly the local `npm run test:run` command —
        # same dist-test/tests/*.test.js glob, same four-file concurrency — with
        # two additive, CI-only diagnostics and nothing else:
        # - --test-timeout=300000 bounds any single hung test at 5 minutes so it
        #   fails the run instead of stalling; module-load hangs, parent-runner
        #   stalls, and leaked exit handles still need the 10-minute step cap.
        # - a second, stderr-bound reporter (scripts/ci/test-file-progress.cjs)
        #   prints one immediate start/complete line per test file while the spec
        #   reporter keeps writing stdout. Unmatched start lines identify files
        #   with no observed completion, not proof their processes remain alive.
        #   Local commands in package.json are unchanged.
        timeout-minutes: 10
        run: node --test --test-concurrency=4 --test-timeout=300000 --test-reporter=spec --test-reporter=./scripts/ci/test-file-progress.cjs --test-reporter-destination=stdout --test-reporter-destination=stderr dist-test/tests/*.test.js

  windows-launcher:
    # Native Windows coverage for the .cmd entry point and its Node helper
    # (issue 108). The compiled launcher-cmd tests include win32-only native
    # cases (cmd.exe + PowerShell invocation, native DDGS provisioning, exit
    # codes, packaged mode) that no POSIX simulation can exercise; POSIX-only
    # cases inside the same file skip themselves. This is a disposable runner
    # checkout, so building production dist here is safe and exercises the
    # exact npm toolchain the launcher invokes for development rebuilds.
    name: Windows launcher (Node 22.19.0)
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PI_REVIEW_GATE_SKIP_PLAYWRIGHT_CHROMIUM: "1"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install dependencies
        run: npm ci
        env:
          PI_REVIEW_GATE_SKIP_PLAYWRIGHT_CHROMIUM: "1"
      - name: Build test bundle
        run: npm run build:test
      # Broad pattern on purpose: it selects EVERY "native Windows Git
      # checkpoint …" regression in the file, so new win32-only checkpoint
      # tests are exercised natively without further workflow edits.
      - name: Windows Git checkpoint native smoke
        run: node --test --test-name-pattern="native Windows Git checkpoint" dist-test/tests/git-checkpoint.test.js
      - name: Windows raw checkpoint regressions (mocked boundaries and native flow)
        run: node --test dist-test/tests/review-checkpoint-windows.test.js
      - name: Windows exact source identity regressions
        run: node --test dist-test/tests/wave-source-identity.test.js
      - name: Launcher tests (helper pipeline + native .cmd cases)
        run: node --test dist-test/tests/launcher-cmd.test.js
      - name: Launcher development-build seam on native Windows
        # The same npm script the launcher's development branch executes
        # (npm --prefix <root> run build), validating the toolchain natively.
        run: npm run build
      - name: Install fresh locked Pi runtime (native Windows)
        # This is a test-only npm ci into an empty runner-temp directory, not a
        # global install or the official installer (which always requests
        # /latest). npm must generate the native pi.cmd executable shim.
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP "pi-ui-runtime"
          if (Test-Path -LiteralPath $runtime) { Remove-Item -LiteralPath $runtime -Recurse -Force -ErrorAction Stop }
          if (Test-Path -LiteralPath $runtime) { throw "Pi runtime temp directory was not cleared" }
          New-Item -ItemType Directory -Path $runtime -Force | Out-Null
          Copy-Item scripts/ci/pi-ui-runtime/package.json, scripts/ci/pi-ui-runtime/package-lock.json -Destination $runtime
          Push-Location $runtime
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
      - name: Installed Pi command RPC and registration smoke (native Windows)
        # Resolve `pi` through src/pi-invocation, run npm's actual installed
        # Windows command shim, and prove RPC + candidate registration without
        # a provider/model call. Missing prerequisites are fatal, not skipped.
        env:
          PI_REVIEW_GATE_INSTALLED_PI_BIN: ${{ runner.temp }}\pi-ui-runtime\node_modules\.bin
          PI_REVIEW_GATE_INSTALLED_AGENT: ${{ runner.temp }}\pi-ui-runtime\node_modules\@earendil-works\pi-coding-agent
          PI_REVIEW_GATE_CANDIDATE_ENTRY: ${{ github.workspace }}\dist\src\index.js
          PI_REVIEW_GATE_REQUIRE_PI_HOST: "1"
          PI_REVIEW_GATE_EXPECT_PI_VERSION: "1.0.2"
        run: node --test dist-test/tests/pi-installed-launch.test.js
      # Issue #204: alias-independent Pi child launch. On this host the only
      # `pi` PATH entry is npm's pi.cmd shim, and a shell:false spawn of the
      # bare name cannot find an executable; these regressions start real
      # child processes through the shared resolver (reviewer prompt, delegated
      # RPC executor, compaction recovery) plus cross-platform resolver/argv
      # safety cases. Require the same installed Pi 1.0.2 host for both real
      # registration cases; missing prerequisites must not silently skip them.
      - name: Pi child launch tests (alias-independent, native Windows)
        env:
          PI_REVIEW_GATE_INSTALLED_PI_BIN: ${{ runner.temp }}\pi-ui-runtime\node_modules\.bin
          PI_REVIEW_GATE_INSTALLED_AGENT: ${{ runner.temp }}\pi-ui-runtime\node_modules\@earendil-works\pi-coding-agent
          PI_REVIEW_GATE_CANDIDATE_ENTRY: ${{ github.workspace }}\dist\src\index.js
          PI_REVIEW_GATE_REQUIRE_PI_HOST: "1"
          PI_REVIEW_GATE_EXPECT_PI_VERSION: "1.0.2"
        # Include bounded teardown when an exited root leaves inherited pipes
        # open in reviewer, RPC executor, and compaction recovery paths.
        run: node --test dist-test/tests/pi-child-launch.test.js dist-test/tests/pi-child-teardown.test.js
      - name: Static docs validation
        run: node scripts/check-docs.cjs
      - name: Docs checker regression tests
        run: node --test dist-test/tests/governance-docs.test.js

  windows-shell:
    # Real PowerShell processes and Job Object ownership on native Windows;
    # both shell-discovery outcomes and descendant cleanup gate publishing.
    name: Windows shell (Node 24)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PI_REVIEW_GATE_SKIP_PLAYWRIGHT_CHROMIUM: "1"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build test bundle
        run: npm run build:test
      # Same broad pattern as the launcher job: every "native Windows Git
      # checkpoint …" regression runs natively on this Node version too.
      - name: Windows Git checkpoint native smoke (Node 24)
        run: node --test --test-name-pattern="native Windows Git checkpoint" dist-test/tests/git-checkpoint.test.js
      - name: Windows raw checkpoint regressions (Node 24)
        run: node --test dist-test/tests/review-checkpoint-windows.test.js
      - name: Windows exact source identity regressions (Node 24)
        run: node --test dist-test/tests/wave-source-identity.test.js
      - name: Windows private wave capture mode smoke (Node 24)
        run: >-
          node --test --test-name-pattern="native Windows wave"
          dist-test/tests/wave-repository.test.js
          dist-test/tests/wave-landing.test.js
      - name: Windows prompt-process termination tests (Node 24)
        run: node --test dist-test/tests/process-telemetry.test.js
      - name: Run Windows shell tests (native)
        run: >-
          node --test
          dist-test/tests/background-shell-windows.test.js
          dist-test/tests/background-shell-jobs.test.js
          dist-test/tests/background-process-readiness.test.js

  release:
    # Publishes the numbered prerelease for a validated main push by calling the
    # reusable builder. It runs only after all verification jobs succeeded:
    # with `needs: [verify, full-tests, windows-launcher, windows-shell]` GitHub's implicit success() guard skips
    # this job when a needed job failed or was skipped, and the explicit `if`
    # re-pins the trust boundary (original push event, refs/heads/main, this
    # repository). PRs, manual dispatches, and foreign repositories can never
    # reach the publisher. No secrets are passed: the callee reads the event's
    # GITHUB_TOKEN from the `github.token` context, so `secrets: inherit` stays
    # unused and the job grants exactly `contents: write` — the only write
    # permission anywhere in this workflow.
    name: Publish numbered prerelease
    needs: [verify, full-tests, windows-launcher, windows-shell]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'rfairburn/pi-review-gate'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
