# Build JVM. Kept modest so a phone-client build cannot starve the host.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Builds must use the JDK the operator exported (JAVA_HOME); never let Gradle
# provision a different one.
org.gradle.java.installations.auto-download=false

# AndroidX only.
android.useAndroidX=true

kotlin.code.style=official
